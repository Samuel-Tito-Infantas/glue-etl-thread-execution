services:
  localstack:
    image: localstack/localstack:3.8.1
    container_name: glue-etl-localstack
    ports:
      - "4566:4566"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      SERVICES: s3
      DEBUG: "0"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./docker/localstack/init:/etc/localstack/init/ready.d:ro
      - ./data/sample/s3:/opt/glue-etl-sample/s3:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  glue:
    image: public.ecr.aws/glue/aws-glue-libs:5
    container_name: glue-etl-aws-glue
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ENDPOINT_URL_S3: http://localstack:4566
      S3_ENDPOINT_URL: http://localstack:4566
      LOCALSTACK_HOSTNAME: localstack
      S3_BUCKET: glue-etl-poc
      S3_INPUT_PREFIX: input/json
      S3_LOOKUP_PREFIX: input/lookup
      S3_LOOKUP_KEY: input/lookup/customers.csv
      S3_OUTPUT_PREFIX: output/enriched
      SPARK_S3_OUTPUT_PREFIX: output/enriched/spark
      DISABLE_SSL: "true"
      SPARK_CONF_DIR: /home/hadoop/workspace/docker/glue/conf
    working_dir: /home/hadoop/workspace
    volumes:
      - .:/home/hadoop/workspace
    command: ["-c", "sleep infinity"]

volumes:
  localstack-data:
